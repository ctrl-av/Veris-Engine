name: Windows builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      GALLIUM_DRIVER: llvmpipe
      LIBGL_ALWAYS_SOFTWARE: 'true'
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Install software OpenGL for graphics checks
        uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72 # v3.0.0
        with:
          version: '26.0.3'
          build-type: release-msvc
          deployment-choice: '1'
      - name: Check dependency download recovery
        run: ./Tests/DependencyDownloads.ps1
      - name: Restore verified native dependencies
        id: native-dependencies
        uses: actions/cache/restore@v4
        with:
          path: .dependencies
          key: native-windows-x64-${{ hashFiles('scripts/InitializeDependencies.ps1', 'scripts/DependencyDownloads.ps1') }}
          restore-keys: |
            native-windows-x64-
            sfml-windows-x64-
      - name: Initialize native dependency
        run: ./scripts/InitializeDependencies.ps1
      - name: Save verified native dependencies
        if: steps.native-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .dependencies
          key: ${{ steps.native-dependencies.outputs.cache-primary-key }}
      - name: Build and validate complete project
        run: |
          $verification = Join-Path (Get-Location).Path 'scripts/VerifyProject.ps1'
          Set-Location $env:RUNNER_TEMP
          & $verification -Configuration ${{ matrix.configuration }}
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ matrix.configuration }}
          if-no-files-found: error
          path: |
            artifacts/publish/${{ matrix.configuration }}/
            artifacts/bin/Engine/x64/${{ matrix.configuration }}/
            artifacts/bin/RenderingDependency/x64/${{ matrix.configuration }}/
            artifacts/bin/VerisRuntime/x64/${{ matrix.configuration }}/
            artifacts/bin/VerisInterop/x64/${{ matrix.configuration }}/
            artifacts/bin/EditorUi/${{ matrix.configuration }}/net8.0-windows/*.png
            artifacts/bin/InteropBehavior/${{ matrix.configuration }}/net8.0-windows/*.png
